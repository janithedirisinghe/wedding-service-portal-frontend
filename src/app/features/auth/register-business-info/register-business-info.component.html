<section class="bg-gray-50 dark:bg-gray-900">
    <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
      <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
          <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
            Business Details
          </h1>
          <form [formGroup]="bussinesForm" (ngSubmit)="onSubmit()" class="space-y-4 md:space-y-6" action="#">
            <div>
              <label for="businessName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Business Name</label>
              <input type="text" formControlName="businessName" name="businessName" id="businessName" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Business Name" required>
            </div>
            <div>
              <label for="location" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Location</label>
              <input type="text" formControlName="location" name="location" id="location" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Location" required>
            </div>
            <div>
              <label for="bio" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Bio</label>
              <input type="text" formControlName="bio" name="bio" id="bio" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Bio of the Bussiness" required>
            </div>
            <div>
              <label for="telNo" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tel No</label>
              <input type="text" formControlName="telNo" name="telNo" id="telNo" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Telephone Number" required>
            </div>
            <div> 
              <label for="VenType" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Vendor Type</label>
              
              <!-- Loading state -->
              <div *ngIf="loadingVendorTypes" class="bg-gray-50 border border-gray-300 text-gray-500 text-sm rounded-lg p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-400">
                <div class="flex items-center">
                  <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Loading vendor types...
                </div>
              </div>
              
              <!-- Vendor type select -->
              <select 
                *ngIf="!loadingVendorTypes" 
                id="VenType" 
                formControlName="VenType" 
                name="VenType" 
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                <option value="" disabled selected>Select a vendor type</option>
                <option *ngFor="let vendorType of vendorTypes" [value]="vendorType.vendorTypeName">
                  {{ vendorType.vendorTypeName }}
                </option>
              </select>
              
              <!-- Empty state -->
              <div *ngIf="!loadingVendorTypes && vendorTypes.length === 0" class="bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded-lg p-2.5">
                <div class="flex items-center">
                  <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.314 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                  </svg>
                  No vendor types available. Please contact support.
                </div>
              </div>
            </div> 
            <div>
              <label for="brn" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Business Registration Number</label>
              <input type="text" name="brn" formControlName="brn" id="brn" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Registration Number" required>
            </div>
            <div>
              <label for="country" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Country</label>
              <input type="text" name="country" formControlName="country" id="country" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Country" required>
            </div>
            <button type="submit" (click)="onSubmit()" [disabled]="isSubmitting" class="w-full text-white bg-blue-500 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
              <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>
