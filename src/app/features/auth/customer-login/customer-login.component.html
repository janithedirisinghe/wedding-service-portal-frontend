<div class="min-h-screen bg-gradient-to-br from-purple-50 to-pink-100 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl overflow-hidden w-full max-w-5xl flex flex-col lg:flex-row">

        <!-- Image Section -->
        <div class="hidden lg:flex lg:w-1/2 relative">
            <img src="https://untgtsclbjlgemwljimq.supabase.co/storage/v1/object/public/Wedding%20Vender%20managment%20System//bw4a0212.jpg"
                alt="Beautiful Wedding" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black bg-opacity-20 flex items-center justify-center">
                <div class="text-center text-white">
                    <h2 class="text-2xl font-bold mb-2">Welcome Back!</h2>
                    <p class="text-lg">Sign in to your customer account</p>
                </div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="w-full lg:w-1/2 p-8 lg:p-12 flex items-center justify-center">
            <div class="w-full max-w-md">

                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Customer Login</h1>
                    <p class="text-gray-600">Find your perfect wedding services</p>
                </div>

                <!-- Form -->
                <form [formGroup]="customerLoginForm" (ngSubmit)="onSubmit()" class="space-y-6">

                    <!-- Username Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                        <div class="relative">
                            <input type="text" placeholder="Enter your username"
                                class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200 bg-gray-50 focus:bg-white"
                                formControlName="username" autofocus autocomplete required>
                            <div *ngIf="customerLoginForm.get('username')?.invalid && customerLoginForm.get('username')?.touched" class="text-red-500 text-sm mt-1">
                                <span *ngIf="customerLoginForm.get('username')?.errors?.['required']">Username is required</span>
                                <span *ngIf="customerLoginForm.get('username')?.errors?.['minlength']">Username must be at least 3 characters</span>
                            </div>
                            <svg class="absolute left-4 top-3.5 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input type="password" placeholder="Enter your password" minlength="6"
                                class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200 bg-gray-50 focus:bg-white"
                                formControlName="password" required>
                            <div *ngIf="customerLoginForm.get('password')?.invalid && customerLoginForm.get('password')?.touched" class="text-red-500 text-sm mt-1">
                                <span *ngIf="customerLoginForm.get('password')?.errors?.['required']">Password is required</span>
                                <span *ngIf="customerLoginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
                            </div>
                            <svg class="absolute left-4 top-3.5 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Forgot Password -->
                    <div class="flex justify-end">
                        <a [routerLink]="['/auth/forgot-password']" [queryParams]="{type: 'customer'}"
                            class="text-sm text-purple-600 hover:text-purple-800 font-medium transition duration-200">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" [disabled]="isSubmitting || customerLoginForm.invalid"
                        class="w-full bg-purple-600 hover:bg-purple-700 disabled:bg-purple-400 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 disabled:cursor-not-allowed shadow-md hover:shadow-lg">
                        <span *ngIf="!isSubmitting">Sign In</span>
                        <span *ngIf="isSubmitting" class="flex items-center justify-center">
                            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Signing In...
                        </span>
                    </button>

                </form>

                <!-- Sign Up Link -->
                <div class="mt-8 text-center">
                    <p class="text-gray-600">Don't have a customer account?
                        <a routerLink="/auth/customer-register" class="text-purple-600 hover:text-purple-800 font-semibold ml-1 transition duration-200">Create one</a>
                    </p>
                </div>

            </div>
        </div>

    </div>
</div>
