<div class="bg-white shadow-md mb-6 border-b-2 border-purple-200 rounded-md overflow-hidden">
  <div class="container mx-auto px-6 py-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center">
      <div class="flex flex-col gap-2 border-l-4 border-purple-500 pl-4">
        <h1 class="text-2xl font-bold text-gray-900 transition-all duration-300 hover:text-purple-600">{{ pageTitle }}</h1>
        <p *ngIf="subtitle" class="text-sm text-gray-500">{{ subtitle }}</p>
      </div>
      
      <!-- Vendor Profile Section in Header -->
      <div class="flex items-center space-x-4 mt-3 md:mt-0">
        <!-- Vendor Profile Info -->
        <div *ngIf="vendor" class="flex items-center space-x-3 bg-gray-50 rounded-lg px-4 py-2">
          <!-- Profile Image -->
          <div class="profile-image-container relative">
            <img 
              *ngIf="vendor.profileImageUrl && !imageError"
              [src]="vendor.profileImageUrl" 
              [alt]="vendor.businessName || 'Vendor Profile'"
              class="w-10 h-10 rounded-full object-cover border-2 border-purple-200 shadow-sm"
              (error)="onImageError($event)">
            <!-- Fallback initials if no image or image error -->
            <div 
              *ngIf="!vendor.profileImageUrl || imageError" 
              class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center text-white font-semibold text-sm border-2 border-purple-200 shadow-sm">
              {{ getVendorInitials() }}
            </div>
          </div>
          
          <!-- Vendor Info -->
          <div class="vendor-info">
            <p class="text-sm font-semibold text-gray-900">{{ vendor.businessName }}</p>
            <p class="text-xs text-gray-500">{{ vendor.VenType }}</p>
          </div>
        </div>
        
        <div class="content-slot">
          <ng-content></ng-content>
        </div>
      </div>
    </div>
  </div>
</div>
